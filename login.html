<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html"><img src="assets/kmutt-engineering-logo.jpg" alt="KMUTT Faculty of Engineering"></a>
    <nav class="nav">
      <a href="index.html">← กลับหน้าหลัก</a>
    </nav>
  </div>
</header>

<main class="login-screen">
  <section class="login-card">
    <span class="eyebrow">WELCOME BACK</span>
    <h1>เข้าสู่ระบบ</h1>
    <p class="muted">ใช้บัญชี KMUTT SSO เพื่อดูทุนที่คุณสมัครและติดตามสถานะ</p>

    <form onsubmit="event.preventDefault();alert('ตัวอย่างหน้าเข้าสู่ระบบ: เชื่อมต่อ KMUTT SSO ในระบบจริงได้ที่ปุ่มนี้')">
      <div class="field">
        <label>อีเมลนักศึกษา</label>
        <input type="email" required placeholder="student@mail.kmutt.ac.th">
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" required placeholder="••••••••">
      </div>
      <button class="btn primary" type="submit">เข้าสู่ระบบด้วย KMUTT SSO</button>
    </form>

    <p class="small muted" style="text-align:center;margin:18px 0 0">พบปัญหาการใช้งาน? <a class="text-link" href="contact.html">ติดต่อเจ้าหน้าที่</a></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
